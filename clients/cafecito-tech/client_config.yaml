# ============================================
# CONTENT OVERRIDES
# ============================================
overrides:
  content:
    default_length: "short"  # Event promos are concise
    primary_format: "carousel_post"  # LinkedIn/Instagram carousels
    secondary_format: "short_video"  # Event highlights, testimonials

  platforms:
    priority:
      - "linkedin"     # Primary: Professional networking
      - "instagram"    # Secondary: Community vibes
      - "email"        # Direct: Attendee/sponsor comms

    linkedin:
      focus: "event_promotion"
      content_types:
        - "event_announcements"
        - "speaker_spotlights"
        - "sponsor_features"
        - "attendee_testimonials"
        - "linkedin_events_feature"

    instagram:
      focus: "community_building"
      content_types:
        - "event_highlights"
        - "behind_the_scenes"
        - "attendee_spotlights"
        - "cultural_moments"
        - "stories_for_engagement"

  tone:
    professional_context: "warm_professional"  # LinkedIn
    community_context: "authentic_casual"      # Instagram
    bilingual_approach: "natural_code_switching"

  language:
    primary: "english"
    secondary: "spanish"
    code_switching: true
    translation_required: false  # Natural bilingual, not translated posts

