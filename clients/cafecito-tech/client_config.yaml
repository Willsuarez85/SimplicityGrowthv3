# ============================================
# NOTES
# ============================================
notes: |
  Event Series Client Notes:

  - This is NOT a product/service client - success metrics focus on attendance,
    engagement, and community growth, not direct sales conversions

  - Bilingual approach is natural code-switching, not translation. Content should
    feel authentic to bilingual professionals, not like translated corporate speak

  - Parent organization (Link Foundation) provides visual foundation but event
    series has room for unique brand expression within that framework

  - Platform strategy differs from typical clients:
    * LinkedIn = Professional credibility + event promotion
    * Instagram = Community vibes + cultural authenticity
    * Email = Direct communication (not social media focused)

  - Content should balance:
    * Professional credibility (we're serious about tech careers)
    * Cultural authenticity (we get the Latino professional experience)
    * Community warmth (this is your tribe, not just networking)

