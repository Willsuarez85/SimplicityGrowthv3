  format: "monthly_networking"
  frequency: "monthly"
  target_audience:
    primary: "Latino tech professionals"
    secondary: "Tech-curious professionals seeking career transition"
    tertiary: "Companies seeking diverse tech talent"

  success_metrics:
    - "event_attendance"
    - "attendance_growth_rate"
    - "sponsor_funding_secured"
    - "professional_database_growth"
    - "linkedin_engagement"
